[project]
name = "mcp-trust-monitor"
version = "0.2.0a1"
description = "Managed MCP client that binds tool trust to reviewed metadata revisions and enforces quarantine before dispatch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "security", "trust", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.30,<1.31",
    "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/Rayhanpatel/mcp-trust-monitor"
Documentation = "https://github.com/Rayhanpatel/mcp-trust-monitor/blob/main/docs/LIBRARY.md"
Repository = "https://github.com/Rayhanpatel/mcp-trust-monitor"
Issues = "https://github.com/Rayhanpatel/mcp-trust-monitor/issues"
Changelog = "https://github.com/Rayhanpatel/mcp-trust-monitor/releases"

[project.optional-dependencies]
openai = ["openai>=2.54,<3"]
semgrep = ["PyYAML>=6,<7"]
all = ["openai>=2.54,<3", "PyYAML>=6,<7"]

[project.scripts]
mcp-trust-monitor = "mcp_trust_monitor.library_cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "openai>=2.54,<3",
    "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.venv*", "/.venv*/**", "/runtime/**", "/dist/**", "/.pytest_cache/**", "/.mypy_cache/**"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_trust_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
