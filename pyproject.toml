[project]
name = "mcp-trust-monitor"
version = "0.1.0"
description = "Managed MCP client that binds tool trust to reviewed metadata revisions and enforces quarantine before dispatch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "openai>=1.60,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_trust_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
